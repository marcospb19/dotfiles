// TURNS OFF BUILD INFO (text bottom left)
r_show_build_info FALSE

bind mwheeldown "+jump"

bind "w" "+forward"
bind "a" "+left"
bind "s" "+back"
bind "d" "+right"

cl_crosshaircolor 5; cl_crosshairalpha 240;cl_crosshaircolor_r 255;cl_crosshaircolor_g 0;cl_crosshaircolor_b 255;cl_crosshairdot 0;cl_crosshairgap -1;cl_crosshairsize 2.1;cl_crosshairstyle 4;cl_crosshairusealpha 1;cl_crosshairthickness 0.8;cl_fixedcrosshairgap -1;cl_crosshair_outlinethickness 0.5;cl_crosshair_drawoutline 1

fps_max 320
mat_vsync 0

// TOGGLEHUD
bind p "toggle cl_draw_only_deathnotices 0 1"
// practice nades locally
bind o "sv_cheats true ; give weapon_smokegrenade ; give weapon_flashbang ; give weapon_hegrenade ; give weapon_molotov"

// NOCLIP ON HOLD
bind "mouse5" "noclip"

unbind ","
bind "," "ent_fire smokegrenade_projectile kill ; ent_fire molotovgrenade_projectile kill ; ent_fire incendiarygrenade_projectile kill"

// I dont even think these work outside of cheats enabled
sv_bhop_time_window 1
sv_jump_spam_penalty_time 0

echo AUTOEXEC-WORKING
